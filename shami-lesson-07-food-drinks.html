<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabic with Taghreed – Lesson 7 Quiz</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1f2a2e;--mute:#5f6b70;--line:#dcdad0;--ok:#1f8a4c;--okbg:#dff3e6;--bad:#c0392b;--badbg:#fbe3df}
@media (prefers-color-scheme:dark){:root{--bg:#14181a;--card:#1d2326;--ink:#eef3f1;--mute:#a3b0b3;--line:#36413f;--ok:#7fd49f;--okbg:#1e3a29;--bad:#f1948a;--badbg:#44231f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5;padding-bottom:48px}
header{background:linear-gradient(135deg,#2a9d8f,#7b5ea7);color:#fff;text-align:center;padding:26px 16px;border-radius:0 0 22px 22px}
#logo{max-height:70px;max-width:92%;background:#fff;border-radius:12px;padding:6px}
h1{font-size:1.15rem;margin:8px 0 2px}
.sub{margin:0;opacity:.92;font-size:.95rem}
.wrap{max-width:740px;margin:0 auto;padding:0 16px}
.top{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top input{flex:1;min-width:160px;font:inherit;color:var(--ink);background:var(--bg);padding:10px 12px;border:2px solid var(--line);border-radius:10px}
.top input:focus{outline:none;border-color:#2a9d8f}
.btn{font:600 15px Georgia,serif;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:#2a9d8f;color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid #e9a23b;outline-offset:2px}
.prog{margin:14px 0 6px;font-size:.9rem;color:var(--mute);display:flex;justify-content:space-between}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e76f51,#e9a23b,#2a9d8f);transition:width .3s}
.q{--c:#2a9d8f;background:color-mix(in srgb,var(--c) 9%,var(--card));border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;margin:14px 0;padding:16px}
.qh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:.9rem;display:grid;place-items:center}
.qt{font-weight:700;font-size:1.05rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:62px;padding:8px 10px;font:inherit;font-size:1.15rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:700 13px sans-serif;display:grid;place-items:center}
.opt .t{flex:1;text-align:center;unicode-bidi:plaintext}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--badbg);border-inline-start:5px solid var(--bad);font-size:.95rem}
.fb b{font-size:1.15rem;unicode-bidi:plaintext}
.res{display:none;background:var(--card);border:1px solid var(--line);border-top:6px solid #7b5ea7;border-radius:14px;padding:22px;margin-top:16px;scroll-margin-top:12px}
.score{font-size:2.8rem;font-weight:700;text-align:center}
.res h2{text-align:center;margin:4px 0 8px}
#lvl{color:#7b5ea7}
.tip{background:var(--bg);border-radius:10px;padding:12px;margin:12px 0}
.mist{background:var(--badbg);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:.92rem}
.mist b{unicode-bidi:plaintext}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1}
#copy{background:#7b5ea7}#again{background:#e76f51;color:#fff;border:0;border-radius:8px;padding:10px 18px}
</style>
</head>

["Which sentence says “I want water” using بدي + noun only (no verb)?","بدي مي.","بدي إشرب مي.","ما بدي مي.","بحب إشرب مي.","بدي + noun: بدي مي. With a verb it would be بدي إشرب مي."],
["Which sentence says “I want to eat chicken” using بدي + verb?","بدي آكل جاج.","بدي جاج.","بحب آكل جاج.","ما بدي آكل جاج.","بدي + verb: بدي آكل جاج."],
["Which sentence means “I want to drink juice”?","بدي إشرب عصير.","بدي آكل عصير.","بحب إشرب عصير.","ما بدي إشرب عصير.","Use إشرب (drink) with drinks: بدي إشرب عصير."],
["Which sentence means “I want to have breakfast”?","بدي افطر.","بفطر الصبح.","ما بدي افطر.","بحب افطر.","بدي + verb: بدي افطر. بفطر الصبح = I have breakfast in the morning."],
["Which sentence means “I don't want to eat meat”?","ما بدي آكل لحمة.","ما بدي إشرب لحمة.","بدي آكل لحمة.","ما بحب آكل لحمة.","ما بدي = I don't want. ما بحب would mean “I don't like”."],
["Which sentence means “I don't want to drink milk”?","ما بدي إشرب حليب.","ما بدي آكل حليب.","بدي إشرب حليب.","ما بحب إشرب حليب.","ما بدي + إشرب حليب = I don't want to drink milk."],
["You refuse tea, saying only that you don't want it (noun, no verb). What do you say?","ما بدي شاي.","بدي شاي.","ما بدي آكل شاي.","بحب إشرب شاي.","ما بدي + noun: ما بدي شاي."],
["Which sentence means “I don't want to drink coffee”?","ما بدي إشرب قهوة.","بدي إشرب قهوة.","ما بدي آكل قهوة.","بحب إشرب قهوة.","ما بدي + إشرب قهوة = I don't want to drink coffee."],
["You tell a friend what you generally like (not what you want right now): “I like to eat chicken.”","بحب آكل جاج.","بدي آكل جاج.","ما بدي آكل جاج.","بحب إشرب جاج.","بحب = I like (general preference); بدي = I want (now)."],
["How do you ask a friend what they like to drink (a general preference)?","شو بتحب تشرب؟","شو بدك تشرب؟","شو بتحب تاكل؟","شو بدك تاكل؟","بتحب = you like, تشرب = to drink."],
["How do you ask a friend what they want to eat right now?","شو بدك تاكل؟","شو بتحب تاكل؟","شو بدك تشرب؟","شو بتحب تشرب؟","بدك = you want, تاكل = to eat."],
["A friend asks what you want to drink. You answer that you want to drink water.","بدي إشرب مي.","بدي آكل مي.","ما بدي إشرب مي.","بحب إشرب مي.","Answer with بدي + إشرب + مي."],
["A friend asks what you like to eat. You answer that you like to eat rice and chicken.","بحب آكل رز وجاج.","بدي آكل رز وجاج.","بحب إشرب رز وجاج.","ما بدي آكل رز وجاج.","The question is about what you like, so use بحب آكل."],
["You've finished your meal and can't eat any more. What do you say?","شبعت.","ما شبعت.","الأكل طيب.","بدي آكل.","شبعت = I'm full."],
["Which sentence means “I want to eat an apple”?","بدي آكل تفاحة.","بدي إشرب تفاحة.","بحب آكل تفاحة.","ما بدي آكل تفاحة.","بدي + آكل + تفاحة. You eat an apple, so إشرب is wrong."],
["You want to tell the cook that the food is delicious. What do you say?","الأكل طيب.","شبعت.","ما شبعت.","بحب آكل جاج.","الأكل طيب = The food is delicious."]
];
const $=id=>document.getElementById(id);
let st=[],answers=[],muted=false,ac=null;
function tone(f,d,t,v){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+d;o.type=t;o.frequency.value=f;
g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+.5);
o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.55);}catch(e){}}
const good=()=>{tone(523,0,"sine",.12);tone(784,.12,"sine",.12)};
const bad=()=>{tone(220,0,"triangle",.14);tone(165,.14,"triangle",.14)};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  answers=new Array(Q.length).fill(null);$("qs").innerHTML="";
  Q.forEach((q,i)=>{
    const COLORS=["#e76f51","#2a9d8f","#7b5ea7","#e9a23b","#3b82c4","#d6477d"];
    const d=document.createElement("div");d.className="q";d.style.setProperty("--c",COLORS[i%COLORS.length]);
    d.innerHTML='<div class="qh"><div class="num">'+(i+1)+'</div><div class="qt"></div></div><div class="opts"></div><div class="fb"></div>';
    d.querySelector(".qt").textContent=q[0];
    const box=d.querySelector(".opts");
    shuffle(q.slice(1,5)).forEach((o,k)=>{
      const b=document.createElement("button");b.type="button";b.className="opt";b.dataset.v=o;
      b.innerHTML='<span class="n">'+(k+1)+'</span><span class="t" dir="auto"></span>';b.querySelector(".t").textContent=o;
      b.onclick=()=>pick(i,d,b,o);box.appendChild(b);
    });
    $("qs").appendChild(d);
  });
  upd();
}
function pick(i,d,b,o){
  const q=Q[i],ok=o===q[1];answers[i]=o;
  d.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.v===q[1])x.classList.add("right")});
  if(ok){good()}else{b.classList.add("wrong");bad();
    const f=d.querySelector(".fb");f.style.display="block";
    f.innerHTML="✗ Correct answer: <b></b><br><span></span>";
    f.querySelector("b").textContent=q[1];f.querySelector("span").textContent=q[5];}
  upd();
}
function upd(){
  const n=answers.filter(a=>a!==null).length;
  $("pt").textContent=n+" / "+Q.length+" answered";
  $("pb").style.width=(n/Q.length*100)+"%";
  $("finish").disabled=n<Q.length;
}
function info(s){
  if(s>=27)return["Excellent ⭐","Your Shami is very strong! Try speaking about your own food and drinks without reading."];
  if(s>=21)return["Very good 👏","You know most of the lesson. Review the mistakes below, then say each corrected sentence out loud."];
  if(s>=15)return["Good 🙂","You're on the right track. Re-read the vocabulary and the بدي / ما بدي rule, then try again."];
  return["Keep practicing 🌱","Go back to the lesson: learn the vocabulary first, then practice بدي + noun and بدي + verb."];
}
let summary="";
$("finish").onclick=()=>{
  const s=answers.filter((a,i)=>a===Q[i][1]).length,nm=$("name").value.trim()||"Student",[l,t]=info(s);
  $("who").textContent=nm;$("sc").textContent=s+" / "+Q.length;$("lvl").textContent=l;$("tip").textContent="Tip: "+t;
  const m=$("mistakes");m.innerHTML="";let lines=[];
  Q.forEach((q,i)=>{if(answers[i]!==q[1]){
    const e=document.createElement("div");e.className="mist";
    e.innerHTML='<div><b>'+(i+1)+'.</b> <span class="a"></span></div><div>Your answer: <b class="y"></b></div><div>Correct: <b class="c"></b></div>';
    e.querySelector(".a").textContent=q[0];e.querySelector(".y").textContent=answers[i];e.querySelector(".c").textContent=q[1];
    m.appendChild(e);lines.push((i+1)+". "+q[0]+"\n   Your answer: "+answers[i]+"\n   Correct: "+q[1]);}});
  if(!lines.length)m.innerHTML='<p style="text-align:center">No mistakes — well done! 🎉</p>';
  summary="Arabic with Taghreed – Lesson 7: Food & Drinks\nName: "+nm+"\nScore: "+s+" / "+Q.length+"\nLevel: "+l+(lines.length?"\n\nMistakes:\n"+lines.join("\n"):"\n\nNo mistakes!");
  $("res").style.display="block";$("res").scrollIntoView({behavior:"smooth"});
};
$("copy").onclick=async()=>{
  const b=$("copy");let ok=false;
  try{await navigator.clipboard.writeText(summary);ok=true}catch(e){
    const t=document.createElement("textarea");t.value=summary;document.body.appendChild(t);t.select();
    try{ok=document.execCommand("copy")}catch(e2){}t.remove();}
  b.textContent=ok?"Copied ✓":"Copy failed";setTimeout(()=>b.textContent="Copy result",1800);
};
$("again").onclick=()=>{$("res").style.display="none";build();window.scrollTo({top:0,behavior:"smooth"})};
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇 Sound off":"🔊 Sound on"};
build();
</script>
</body>
</html>
